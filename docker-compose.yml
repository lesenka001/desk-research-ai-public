# Whole system in one resource: database, worker and bot.
# Coolify fills the SERVICE_* values itself; set TELEGRAM_TOKEN, OPENWEBUI_API_KEY and MODEL.
# The daily collection is a scheduled task in the worker container: python main.py collector
services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=desk_research
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d desk_research"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    environment:
      - BLOCK=worker
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/desk_research
      - OPENWEBUI_BASE_URL=${OPENWEBUI_BASE_URL:-https://inside.omirussia.ru}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}
      - MODEL=${MODEL:-qwen3.8-27b}
      - PROMPT_VERSION=${PROMPT_VERSION:-audience-human-shares-v4}
      - REPROCESS_OLD=${REPROCESS_OLD:-0}
      - REPROCESS_MATERIAL_IDS=${REPROCESS_MATERIAL_IDS:-}
      - MAX_FINDINGS_PER_MATERIAL=${MAX_FINDINGS_PER_MATERIAL:-20}
      - WORKER_BATCH_SIZE=${WORKER_BATCH_SIZE:-20}
      - MAX_TEXT_CHARS=${MAX_TEXT_CHARS:-12000}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-10000}
      - MAX_PER_SOURCE=${MAX_PER_SOURCE:-10}
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    environment:
      - SERVICE_FQDN_BOT_8080
      - BLOCK=bot
      - PORT=8080
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/desk_research
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - MINI_APP_URL=${SERVICE_FQDN_BOT}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    environment:
      - BLOCK=web
      - PORT=8000
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/desk_research
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
